<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'self';img-src 'self' data: blob:;connect-src 'none';object-src 'none';frame-src 'none';base-uri 'none';form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WillBuddy Office</title><link rel="stylesheet" href="office.css"></head><body><header><img src="../assets/logo.png" alt="WillBuddy"><b id="name">WillBuddy Office</b><span id="status" role="status">正在打开文档…</span><span id="action-status" role="status" aria-live="polite"></span><button id="save">保存</button><button id="toggle-ai" class="primary">AI 对话</button></header><nav aria-label="常用编辑"><button data-command=".uno:Undo">撤销</button><button data-command=".uno:Redo">重做</button><i></i><button data-command=".uno:Bold"><b>B</b></button><button data-command=".uno:Italic"><em>I</em></button><button data-command=".uno:Underline"><u>U</u></button><button data-command=".uno:SelectAll">全选</button><i></i><span id="cell-nav" hidden><input id="cell-ref" aria-label="单元格范围" value="A1" maxlength="16"><button id="goto-cell">定位</button></span><button id="up">上一屏</button><button id="down">下一屏</button><label>缩放<select id="zoom"><option value="20">75%</option><option value="15" selected>100%</option><option value="10">150%</option></select></label><small>原格式保存</small></nav><main><section id="editor"><div id="error" role="alert" hidden></div><div id="viewport"><canvas id="document" width="900" height="700" tabindex="0" aria-label="Office文档编辑画布"></canvas></div><div id="parts" aria-label="工作表或幻灯片"></div><div id="selection-row"><span id="selection">点击或拖选正文；也可先全选</span><button id="selection-ai">AI 编辑选区</button></div><div class="input-row"><textarea id="edit-text" rows="2" placeholder="在光标处输入，或替换当前选区（支持中文、换行及表格TSV粘贴）" aria-label="输入或替换选区文字"></textarea><button id="insert" class="primary">写入文档</button></div></section><aside id="ai" hidden><div class="ai-head"><b>WillBuddy · 当前文档</b><button id="close-ai">收起</button></div><p class="hint">选中内容后交给 AI 修改；没有选区时可总结当前文档。点击发送会将当前正文与选区发给所选模型；AI 修改选区仍单独确认。</p><div id="messages" aria-live="polite"></div><form id="ask"><textarea id="prompt" placeholder="例如：将选中的内容简化成三点（Enter发送，Shift+Enter换行）" aria-label="Office AI要求" required maxlength="8000"></textarea><div class="ask-actions"><select id="model" aria-label="Office模型"><option value="legacy">当前默认模型</option></select><button type="button" id="cancel" hidden>停止</button><button id="send" class="primary">发送</button></div></form></aside></main><footer>WillBuddy Office · 内容在本机处理；AI 请求发往你选定的模型。当前为基础嵌入式编辑，复杂对象、键盘/输入法与 Mac 原生兼容仍需验收。</footer><script type="module" src="office.js"></script></body></html>
